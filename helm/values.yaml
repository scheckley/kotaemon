image:
  repository: scheckley/kotaemon
  tag: latest
  pullPolicy: Always

replicaCount: 1

storage:
  size: 10Gi
  storageClassName: ""  # Use cluster default

service:
  port: 80
  containerPort: 7860
  targetPort: 7860

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 4Gi

route:
  enabled: true
  port: 80
  tls:
    enabled: true
    termination: edge
